# يبني VidDrop.exe ويختبره على Windows، وينشره كـ Release:
#  • push على main: إذا لم يكن هناك Release لرقم APP_VERSION بعد ← يبني، يختبر، ينشئ الـ tag والـ Release
#  • tag يبدأ بـ v: نفس الشيء (ويتأكد أن الـ tag يطابق APP_VERSION)
#  • pull request: يبني ويختبر فقط، بدون نشر
#  • كل أسبوع: إذا صدر yt-dlp جديد ← نسخة برقم فرعي (1.3 ← 1.3.1) تصل للمستخدمين كتحديث
# التفاصيل في .github/scripts/plan_release.py
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # كل يوم اثنين 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plan
        id: plan
        run: python .github/scripts/plan_release.py

      - name: Install dependencies
        if: steps.plan.outputs.build == 'true'
        run: |
          python -m pip install -U pip
          python -m pip install -U -r requirements.txt pyinstaller

      - name: Make icon and splash
        if: steps.plan.outputs.build == 'true'
        run: python make_icon.py

      - name: Build VidDrop.exe
        if: steps.plan.outputs.build == 'true'
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name VidDrop --icon icon.ico --splash splash.png
          --collect-all customtkinter
          --collect-all imageio_ffmpeg
          --collect-all yt_dlp_ejs
          --collect-submodules yt_dlp
          viddrop.py

      - name: Test on Windows (self-test, first run, update, relaunch)
        if: steps.plan.outputs.build == 'true'
        timeout-minutes: 20
        run: python .github/scripts/test_windows.py

      - name: Commit version bump
        if: steps.plan.outputs.bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "${{ steps.plan.outputs.tag }} — yt-dlp update"
          git push origin HEAD:main

      - name: Publish release
        if: steps.plan.outputs.publish == 'true'
        run: |
          python .github/scripts/release_notes.py "${{ steps.plan.outputs.tag }}"
          gh release create "${{ steps.plan.outputs.tag }}" dist/VidDrop.exe --target "$(git rev-parse HEAD)" --title "VidDrop ${{ steps.plan.outputs.tag }}" --notes-file notes.md
